<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin - Repasse de Rotas</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050816;
  color: white;
}

header {
  padding: 24px;
  background: linear-gradient(135deg, #ee4d2d, #111827);
  border-bottom: 1px solid #333;
}

header h1 { margin: 0; }
header p { margin: 6px 0 0; opacity: .85; }

.container {
  padding: 24px;
  display: grid;
  gap: 24px;
}

.top-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.card {
  background: #111827;
  border: 1px solid #263044;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 15px 35px rgba(0,0,0,.35);
}

.card h2 {
  margin-top: 0;
  color: #ffb199;
}

input, select {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border-radius: 12px;
  border: 1px solid #374151;
  background: #020617;
  color: white;
}

button {
  border: none;
  border-radius: 12px;
  padding: 11px 14px;
  background: #ee4d2d;
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin: 4px;
}

button:hover { background: #ff6a3d; }

.btn-dark { background: #374151; }
.btn-warn { background: #ca8a04; }
.btn-ok { background: #16a34a; }

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 850px;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #263044;
  text-align: left;
}

th {
  color: #ffb199;
  background: #0b1020;
}

.badge {
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: bold;
}

.on { background: #064e3b; color: #86efac; }
.off { background: #450a0a; color: #fca5a5; }
.route-ok { background: #1e3a8a; color: #bfdbfe; }
.route-done { background: #713f12; color: #fde68a; }

.checks {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 10px 0;
}

.checks label {
  background: #020617;
  padding: 10px 12px;
  border-radius: 999px;
  border: 1px solid #374151;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 20px;
}

.modal-box {
  background: #111827;
  border: 1px solid #374151;
  border-radius: 20px;
  padding: 24px;
  width: 100%;
  max-width: 480px;
}

.modal-box h2 {
  margin-top: 0;
  color: #ffb199;
}

.modal-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
</style>
</head>

<body>

<header>
  <h1>Painel Admin - Repasse de Rotas</h1>
  <p>Controle motoristas, rotas, punições e repasses em tempo real.</p>
</header>

<div class="container">

  <div class="top-actions">
    <button onclick="abrirModal('modalMotorista')">+ Novo motorista</button>
    <button onclick="abrirModal('modalRota')">+ Divulgar rota</button>
    <button class="btn-dark" onclick="trocarSenha()">Trocar senha admin</button>
  </div>

  <div class="card">
    <h2>Motoristas cadastrados</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Veículo</th>
            <th>Status</th>
            <th>Punição até</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="driversTable"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>Rotas divulgadas</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Rota</th>
            <th>Região</th>
            <th>Veículos</th>
            <th>Status</th>
            <th>Motorista</th>
            <th>Horário</th>
          </tr>
        </thead>
        <tbody id="routesTable"></tbody>
      </table>
    </div>
  </div>

</div>

<div class="modal" id="modalMotorista">
  <div class="modal-box">
    <h2>Cadastrar motorista</h2>
    <input id="driverId" placeholder="ID do motorista">
    <input id="driverName" placeholder="Nome do motorista">
    <select id="vehicleType">
      <option value="FIORINO">FIORINO</option>
      <option value="PASSEIO">PASSEIO</option>
      <option value="MOTO">MOTO</option>
    </select>
    <div class="modal-actions">
      <button onclick="cadastrarMotorista()">Cadastrar</button>
      <button class="btn-dark" onclick="fecharModal('modalMotorista')">Cancelar</button>
    </div>
  </div>
</div>

<div class="modal" id="modalRota">
  <div class="modal-box">
    <h2>Divulgar rota</h2>
    <input id="routeName" placeholder="Rota. Ex: B-14+B-15/120">
    <input id="region" placeholder="Região. Ex: Guarulhos">

    <div class="checks">
      <label><input type="checkbox" value="FIORINO" class="vehicle"> FIORINO</label>
      <label><input type="checkbox" value="PASSEIO" class="vehicle"> PASSEIO</label>
      <label><input type="checkbox" value="MOTO" class="vehicle"> MOTO</label>
    </div>

    <div class="modal-actions">
      <button onclick="divulgarRota()">Divulgar</button>
      <button class="btn-dark" onclick="fecharModal('modalRota')">Cancelar</button>
    </div>
  </div>
</div>

<script>
const API = "https://truthful-acceptance-production-fb55.up.railway.app";

let ADMIN_TOKEN = localStorage.getItem("ADMIN_TOKEN") || "";

if (!ADMIN_TOKEN) {
  ADMIN_TOKEN = prompt("Digite a senha do admin:");
  localStorage.setItem("ADMIN_TOKEN", ADMIN_TOKEN);
}

function adminHeaders() {
  return {
    "Content-Type": "application/json",
    "X-Admin-Token": ADMIN_TOKEN
  };
}

function abrirModal(id) {
  document.getElementById(id).style.display = "flex";
}

function fecharModal(id) {
  document.getElementById(id).style.display = "none";
}

function trocarSenha() {
  localStorage.removeItem("ADMIN_TOKEN");
  location.reload();
}

async function tratarResposta(res) {
  const data = await res.json();

  if (res.status === 401) {
    alert("Senha admin incorreta.");
    localStorage.removeItem("ADMIN_TOKEN");
    location.reload();
    return null;
  }

  return data;
}

async function cadastrarMotorista() {
  const body = {
    action: "create",
    driver_id: driverId.value.trim(),
    driver_name: driverName.value.trim(),
    vehicle_type: vehicleType.value
  };

  if (!body.driver_id || !body.driver_name) {
    alert("Preencha ID e nome.");
    return;
  }

  const res = await fetch(API + "/admin-drivers.php", {
    method: "POST",
    headers: adminHeaders(),
    body: JSON.stringify(body)
  });

  const data = await tratarResposta(res);
  if (!data) return;

  if (data.success) {
    alert("Motorista cadastrado.");
    driverId.value = "";
    driverName.value = "";
    fecharModal("modalMotorista");
    carregarDados();
  } else {
    alert(data.error || "Erro ao cadastrar motorista.");
  }
}

async function divulgarRota() {
  const selected = [...document.querySelectorAll(".vehicle:checked")].map(c => c.value);

  if (!routeName.value.trim() || !region.value.trim() || selected.length === 0) {
    alert("Preencha rota, região e pelo menos um veículo.");
    return;
  }

  const res = await fetch(API + "/admin-routes.php", {
    method: "POST",
    headers: adminHeaders(),
    body: JSON.stringify({
      route_name: routeName.value.trim(),
      region: region.value.trim(),
      allowed_vehicles: selected
    })
  });

  const data = await tratarResposta(res);
  if (!data) return;

  if (data.success) {
    alert("Rota divulgada.");
    routeName.value = "";
    region.value = "";
    document.querySelectorAll(".vehicle").forEach(c => c.checked = false);
    fecharModal("modalRota");
    carregarDados();
  } else {
    alert(data.error || "Erro ao divulgar rota.");
  }
}

async function acaoMotorista(action, driver_id) {
  const res = await fetch(API + "/admin-drivers.php", {
    method: "POST",
    headers: adminHeaders(),
    body: JSON.stringify({ action, driver_id })
  });

  const data = await tratarResposta(res);
  if (!data) return;

  carregarDados();
}

async function carregarDados() {
  const driversRes = await fetch(API + "/admin-drivers.php", {
    headers: { "X-Admin-Token": ADMIN_TOKEN }
  });

  const drivers = await tratarResposta(driversRes);
  if (!drivers) return;

  const routesRes = await fetch(API + "/admin-routes.php", {
    headers: { "X-Admin-Token": ADMIN_TOKEN }
  });

  const routes = await tratarResposta(routesRes);
  if (!routes) return;

  driversTable.innerHTML = drivers.map(d => `
    <tr>
      <td>${d.driver_id}</td>
      <td>${d.driver_name}</td>
      <td>${d.vehicle_type}</td>
      <td><span class="badge ${d.active ? "on" : "off"}">${d.active ? "ATIVO" : "DESATIVADO"}</span></td>
      <td>${d.punished_until || "-"}</td>
      <td>
        <button class="btn-dark" onclick="acaoMotorista('toggle','${d.driver_id}')">Ativar/Desativar</button>
        <button class="btn-warn" onclick="acaoMotorista('punish','${d.driver_id}')">Punir 15h</button>
        <button class="btn-ok" onclick="acaoMotorista('remove_punish','${d.driver_id}')">Remover punição</button>
      </td>
    </tr>
  `).join("");

  routesTable.innerHTML = routes.map(r => `
    <tr>
      <td>${r.route_name}</td>
      <td>${r.region}</td>
      <td>${r.allowed_vehicles}</td>
      <td><span class="badge ${r.status === "disponivel" ? "route-ok" : "route-done"}">${r.status}</span></td>
      <td>${r.claimed_by_driver_name || "-"}</td>
      <td>${r.claimed_at || "-"}</td>
    </tr>
  `).join("");
}

carregarDados();
setInterval(carregarDados, 5000);
</script>

</body>
</html>
