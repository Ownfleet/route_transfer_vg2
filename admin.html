<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial;
  background:#050816;
  color:white;
}

body.locked .app{display:none}

.header{
  padding:20px;
  background:linear-gradient(135deg,#ee4d2d,#111827);
}

.actions{
  padding:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  padding:12px;
  border:none;
  border-radius:12px;
  background:#ee4d2d;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.btn-dark{background:#374151}
.btn-warn{background:#ca8a04}
.btn-ok{background:#16a34a}
.btn-danger{background:#991b1b}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  justify-content:center;
  align-items:center;
}

.modal.show{display:flex}

.modal-box{
  background:#111827;
  padding:20px;
  border-radius:20px;
  width:100%;
  max-width:500px;
}

input,select{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #374151;
  background:#020617;
  color:white;
}

.route{
  background:#020617;
  padding:15px;
  border-radius:15px;
  margin:10px 0;
}

.badge{
  padding:5px 10px;
  border-radius:999px;
  font-size:12px;
}

.disp{background:#065f46}
.rep{background:#92400e}
</style>
</head>

<body class="locked">

<div class="app">

<div class="header">
  <h2>Painel Admin</h2>
</div>

<div class="actions">
  <button onclick="abrirModal('mMotorista')">Novo motorista</button>
  <button onclick="abrirModal('mConsulta')">Consultar motorista</button>
  <button onclick="abrirModal('mRota')">Divulgar rota</button>
  <button onclick="abrirRotas()">Gerenciar rotas</button>
  <button onclick="abrirNotificacoes()">🔔 <span id="notif">0</span></button>
  <button class="btn-dark" onclick="logout()">Sair</button>
</div>

</div>

<!-- LOGIN -->
<div class="modal show" id="mLogin">
  <div class="modal-box">
    <h3>Login admin</h3>
    <input id="senha" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
  </div>
</div>

<!-- CADASTRAR -->
<div class="modal" id="mMotorista">
  <div class="modal-box">
    <h3>Novo motorista</h3>
    <input id="id" placeholder="ID">
    <input id="nome" placeholder="Nome">
    <select id="tipo">
      <option>FIORINO</option>
      <option>PASSEIO</option>
      <option>MOTO</option>
    </select>
    <button onclick="criar()">Salvar</button>
  </div>
</div>

<!-- CONSULTA -->
<div class="modal" id="mConsulta">
  <div class="modal-box">
    <h3>Consultar</h3>
    <input id="idBusca" placeholder="ID">
    <button onclick="buscar()">Buscar</button>
    <div id="res"></div>
  </div>
</div>

<!-- ROTA -->
<div class="modal" id="mRota">
  <div class="modal-box">
    <h3>Nova rota</h3>
    <input id="rota" placeholder="Rota">
    <input id="regiao" placeholder="Região">
    <button onclick="novaRota()">Criar</button>
  </div>
</div>

<!-- ROTAS -->
<div class="modal" id="mRotas">
  <div class="modal-box">
    <h3>Rotas</h3>
    <div id="rotas"></div>
  </div>
</div>

<!-- NOTIF -->
<div class="modal" id="mNotif">
  <div class="modal-box">
    <h3>Notificações</h3>
    <div id="listaNotif"></div>
  </div>
</div>

<script>
const API="https://truthful-acceptance-production-fb55.up.railway.app"
let token=localStorage.getItem("token")||""
let notif=[]
let mapa=new Map()

function abrirModal(id){document.getElementById(id).classList.add("show")}
function fecharModal(id){document.getElementById(id).classList.remove("show")}
function modalAberto(){return document.querySelector(".modal.show:not(#mLogin)")}

async function login(){
  token=senha.value
  const r=await fetch(API+"/admin-drivers.php",{headers:{"X-Admin-Token":token}})
  if(r.status!==200){senha.value="";return}
  localStorage.setItem("token",token)
  document.body.classList.remove("locked")
  fecharModal("mLogin")
}

function logout(){localStorage.clear();location.reload()}

async function criar(){
  await fetch(API+"/admin-drivers.php",{
    method:"POST",
    headers:{"Content-Type":"application/json","X-Admin-Token":token},
    body:JSON.stringify({
      action:"create",
      driver_id:id.value,
      driver_name:nome.value,
      vehicle_type:tipo.value
    })
  })
  fecharModal("mMotorista")
}

async function buscar(){
  const r=await fetch(API+"/admin-drivers.php?driver_id="+idBusca.value,{
    headers:{"X-Admin-Token":token}
  })
  const d=await r.json()
  if(!d){res.innerHTML="Não encontrado";return}

  res.innerHTML=`
    <p>${d.driver_name}</p>
    <button onclick="acao('toggle','${d.driver_id}')">Ativar</button>
    <button onclick="acao('punish','${d.driver_id}')">Punir</button>
  `
}

async function acao(a,id){
  await fetch(API+"/admin-drivers.php",{
    method:"POST",
    headers:{"Content-Type":"application/json","X-Admin-Token":token},
    body:JSON.stringify({action:a,driver_id:id})
  })
  buscar()
}

async function novaRota(){
  await fetch(API+"/admin-routes.php",{
    method:"POST",
    headers:{"Content-Type":"application/json","X-Admin-Token":token},
    body:JSON.stringify({
      route_name:rota.value,
      region:regiao.value,
      allowed_vehicles:["FIORINO","PASSEIO"]
    })
  })
  fecharModal("mRota")
}

async function abrirRotas(){
  abrirModal("mRotas")
  const r=await fetch(API+"/admin-routes.php",{headers:{"X-Admin-Token":token}})
  const dados=await r.json()

  rotas.innerHTML=dados.map(x=>`
    <div class="route">
      <b>${x.route_name}</b>
      <span class="badge ${x.status==="disponivel"?"disp":"rep"}">${x.status}</span>
      <button onclick="reabrir(${x.id})">Reabrir</button>
      <button onclick="excluir(${x.id})">Excluir</button>
    </div>
  `).join("")
}

async function reabrir(id){
  await fetch(API+"/admin-routes.php",{
    method:"POST",
    headers:{"Content-Type":"application/json","X-Admin-Token":token},
    body:JSON.stringify({action:"reopen",id})
  })
  abrirRotas()
}

async function excluir(id){
  await fetch(API+"/admin-routes.php",{
    method:"POST",
    headers:{"Content-Type":"application/json","X-Admin-Token":token},
    body:JSON.stringify({action:"delete",id})
  })
  abrirRotas()
}

function abrirNotificacoes(){
  notif.innerText="0"
  abrirModal("mNotif")
  listaNotif.innerHTML=notif.map(n=>`
    <div class="route">
      ${n.route_name} - ${n.claimed_by_driver_name}
    </div>
  `).join("")
}

async function verificar(){
  if(modalAberto())return

  const r=await fetch(API+"/admin-routes.php",{headers:{"X-Admin-Token":token}})
  const dados=await r.json()

  dados.forEach(x=>{
    const antes=mapa.get(x.id)
    if(antes && antes.status==="disponivel" && x.status==="repassada"){
      notif.unshift(x)
      notifCount.innerText=notif.length
    }
    mapa.set(x.id,x)
  })
}

setInterval(verificar,15000)
</script>

</body>
</html>
