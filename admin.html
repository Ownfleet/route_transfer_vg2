<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin - Repasse de Rotas</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050816;
  color: white;
}

header {
  padding: 24px;
  background: linear-gradient(135deg, #ee4d2d, #111827);
  border-bottom: 1px solid #333;
}

header h1 { margin: 0; }
header p { margin: 6px 0 0; opacity: .85; }

.container {
  padding: 24px;
  display: grid;
  gap: 24px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 20px;
}

.card {
  background: #111827;
  border: 1px solid #263044;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 15px 35px rgba(0,0,0,.35);
}

.card h2 {
  margin-top: 0;
  color: #ffb199;
}

input, select {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border-radius: 12px;
  border: 1px solid #374151;
  background: #020617;
  color: white;
}

button {
  border: none;
  border-radius: 12px;
  padding: 11px 14px;
  background: #ee4d2d;
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin: 4px;
}

button:hover { background: #ff6a3d; }

.btn-dark { background: #374151; }
.btn-warn { background: #ca8a04; }
.btn-ok { background: #16a34a; }

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 850px;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #263044;
  text-align: left;
}

th {
  color: #ffb199;
  background: #0b1020;
}

.badge {
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: bold;
}

.on { background: #064e3b; color: #86efac; }
.off { background: #450a0a; color: #fca5a5; }
.route-ok { background: #1e3a8a; color: #bfdbfe; }
.route-done { background: #713f12; color: #fde68a; }

.checks {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 10px 0;
}

.checks label {
  background: #020617;
  padding: 10px 12px;
  border-radius: 999px;
  border: 1px solid #374151;
}
</style>
</head>

<body>

<header>
  <h1>Painel Admin - Repasse de Rotas</h1>
  <p>Cadastre motoristas, divulgue rotas e controle status em tempo real.</p>
</header>

<div class="container">

  <div class="cards">
    <div class="card">
      <h2>Cadastrar motorista</h2>
      <input id="driverId" placeholder="ID do motorista">
      <input id="driverName" placeholder="Nome do motorista">
      <select id="vehicleType">
        <option value="FIORINO">FIORINO</option>
        <option value="PASSEIO">PASSEIO</option>
        <option value="MOTO">MOTO</option>
      </select>
      <button onclick="cadastrarMotorista()">Cadastrar motorista</button>
    </div>

    <div class="card">
      <h2>Divulgar rota</h2>
      <input id="routeName" placeholder="Rota. Ex: B-14+B-15/120">
      <input id="region" placeholder="Região. Ex: Guarulhos">

      <div class="checks">
        <label><input type="checkbox" value="FIORINO" class="vehicle"> FIORINO</label>
        <label><input type="checkbox" value="PASSEIO" class="vehicle"> PASSEIO</label>
        <label><input type="checkbox" value="MOTO" class="vehicle"> MOTO</label>
      </div>

      <button onclick="divulgarRota()">Divulgar rota</button>
    </div>
  </div>

  <div class="card">
    <h2>Motoristas cadastrados</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Veículo</th>
            <th>Status</th>
            <th>Punição até</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="driversTable"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>Rotas divulgadas</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Rota</th>
            <th>Região</th>
            <th>Veículos</th>
            <th>Status</th>
            <th>Motorista</th>
            <th>Horário</th>
          </tr>
        </thead>
        <tbody id="routesTable"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const API = "https://truthful-acceptance-production-fb55.up.railway.app";

async function cadastrarMotorista() {
  const body = {
    action: "create",
    driver_id: driverId.value.trim(),
    driver_name: driverName.value.trim(),
    vehicle_type: vehicleType.value
  };

  if (!body.driver_id || !body.driver_name) {
    alert("Preencha ID e nome.");
    return;
  }

  await fetch(API + "/admin-drivers.php", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });

  alert("Motorista cadastrado.");
  driverId.value = "";
  driverName.value = "";
  carregarDados();
}

async function divulgarRota() {
  const selected = [...document.querySelectorAll(".vehicle:checked")].map(c => c.value);

  if (!routeName.value.trim() || !region.value.trim() || selected.length === 0) {
    alert("Preencha rota, região e pelo menos um veículo.");
    return;
  }

  await fetch(API + "/admin-routes.php", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      route_name: routeName.value.trim(),
      region: region.value.trim(),
      allowed_vehicles: selected
    })
  });

  alert("Rota divulgada.");
  routeName.value = "";
  region.value = "";
  document.querySelectorAll(".vehicle").forEach(c => c.checked = false);
  carregarDados();
}

async function acaoMotorista(action, driver_id) {
  await fetch(API + "/admin-drivers.php", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ action, driver_id })
  });

  carregarDados();
}

async function carregarDados() {
  const drivers = await fetch(API + "/admin-drivers.php").then(r => r.json());
  const routes = await fetch(API + "/admin-routes.php").then(r => r.json());

  driversTable.innerHTML = drivers.map(d => `
    <tr>
      <td>${d.driver_id}</td>
      <td>${d.driver_name}</td>
      <td>${d.vehicle_type}</td>
      <td><span class="badge ${d.active ? "on" : "off"}">${d.active ? "ATIVO" : "DESATIVADO"}</span></td>
      <td>${d.punished_until || "-"}</td>
      <td>
        <button class="btn-dark" onclick="acaoMotorista('toggle','${d.driver_id}')">Ativar/Desativar</button>
        <button class="btn-warn" onclick="acaoMotorista('punish','${d.driver_id}')">Punir 15h</button>
        <button class="btn-ok" onclick="acaoMotorista('remove_punish','${d.driver_id}')">Remover punição</button>
      </td>
    </tr>
  `).join("");

  routesTable.innerHTML = routes.map(r => `
    <tr>
      <td>${r.route_name}</td>
      <td>${r.region}</td>
      <td>${r.allowed_vehicles}</td>
      <td><span class="badge ${r.status === "disponivel" ? "route-ok" : "route-done"}">${r.status}</span></td>
      <td>${r.claimed_by_driver_name || "-"}</td>
      <td>${r.claimed_at || "-"}</td>
    </tr>
  `).join("");
}

carregarDados();
setInterval(carregarDados, 5000);
</script>

</body>
</html>
