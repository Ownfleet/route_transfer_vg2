<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotas Disponíveis</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #030712;
  color: white;
}

header {
  text-align: center;
  padding: 26px 15px 10px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

.top-actions {
  max-width: 520px;
  margin: 14px auto 0;
  padding: 0 20px;
}

.wait-btn {
  background: #16a34a;
}

.grid {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 24px;
}

.card {
  position: relative;
  background: linear-gradient(145deg, #171b2a, #0b1020);
  border: 1px solid #2b3448;
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 12px 30px rgba(0,0,0,.35);
  overflow: hidden;
}

.status {
  position: absolute;
  top: 18px;
  right: -35px;
  transform: rotate(10deg);
  padding: 8px 55px;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
  border: 1px solid;
}

.disponivel {
  background: #052e16;
  color: #86efac;
  border-color: #22c55e;
}

.repassada {
  background: #3b2f06;
  color: #fde68a;
  border-color: #facc15;
}

.card h2 {
  margin: 0 0 12px;
  font-size: 22px;
}

.card p {
  font-size: 18px;
  font-weight: bold;
}

.tags {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 18px 0;
}

.tag {
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: bold;
  border: 1px solid #facc15;
  color: #facc15;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: #ee4d2d;
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.08);
}

button:disabled {
  background: #111827;
  color: #6b7280;
  cursor: not-allowed;
  border: 1px solid #1f2937;
}

.empty {
  text-align: center;
  color: #ccc;
  margin-top: 40px;
  grid-column: 1 / -1;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.78);
  align-items: center;
  justify-content: center;
  z-index: 10;
  padding: 18px;
}

.modal.show {
  display: flex;
}

.modal-box {
  background: linear-gradient(145deg, #111827, #080d1c);
  border: 1px solid #374151;
  border-radius: 24px;
  padding: 24px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 25px 60px rgba(0,0,0,.55);
}

.modal-box h2 {
  margin-top: 0;
  color: #ffb199;
}

.modal-box p {
  color: #cbd5e1;
  line-height: 1.5;
  white-space: pre-line;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  border: 1px solid #374151;
  background: #020617;
  color: white;
  margin: 12px 0;
  font-size: 16px;
}

.cancelar {
  background: #374151;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <h1>Rotas Disponíveis</h1>
  <div class="top-actions">
    <button class="wait-btn" onclick="abrirAguardarGalpao()">Aguardar rota no galpão</button>
  </div>
</header>

<main class="grid" id="rotas"></main>

<div class="modal" id="modalPegar">
  <div class="modal-box">
    <h2>Confirmar rota</h2>
    <p id="rotaSelecionada"></p>
    <input id="driverId" placeholder="Digite seu ID">
    <button onclick="confirmarRota()">Confirmar e pegar rota</button>
    <button class="cancelar" onclick="fecharModal('modalPegar')">Cancelar</button>
  </div>
</div>

<div class="modal" id="modalAguardar">
  <div class="modal-box">
    <h2>Aguardar rota no galpão</h2>
    <p>Digite seu ID e permita a localização do celular para registrar sua presença no galpão.</p>
    <input id="waitingDriverId" placeholder="Digite seu ID">
    <button onclick="confirmarAguardarGalpao()">Registrar presença</button>
    <button class="cancelar" onclick="fecharModal('modalAguardar')">Cancelar</button>
  </div>
</div>

<div class="modal" id="modalResultado">
  <div class="modal-box">
    <h2 id="resultadoTitulo"></h2>
    <p id="resultadoTexto"></p>
    <button onclick="fecharModal('modalResultado')">Entendi</button>
  </div>
</div>

<script>
const API = "https://truthful-acceptance-production-fb55.up.railway.app";
let rotaAtual = null;

function existeModalAberto() {
  return document.querySelector(".modal.show") !== null;
}

function abrirModal(id) {
  document.getElementById(id).classList.add("show");
}

function fecharModal(id) {
  document.getElementById(id).classList.remove("show");
}

function mostrarResultado(titulo, texto) {
  resultadoTitulo.innerText = titulo;
  resultadoTexto.innerText = texto;
  abrirModal("modalResultado");
}

async function carregarRotas(forcar = false) {
  if (!forcar && existeModalAberto()) return;

  const res = await fetch(API + "/routes.php");
  const rotasData = await res.json();

  const container = document.getElementById("rotas");
  container.innerHTML = "";

  if (!rotasData.length) {
    container.innerHTML = `<div class="empty">Nenhuma rota divulgada no momento.</div>`;
    return;
  }

  rotasData.forEach(rota => {
    const veiculos = String(rota.allowed_vehicles)
      .replace("{", "")
      .replace("}", "")
      .split(",");

    const disponivel = rota.status === "disponivel";

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="status ${disponivel ? "disponivel" : "repassada"}">
        ${disponivel ? "DISPONÍVEL" : "ROTA REPASSADA"}
      </div>

      <h2>ROTA: ${rota.route_name}</h2>
      <p>Região: ${rota.region}</p>

      <div class="tags">
        ${veiculos.map(v => `<span class="tag">${v}</span>`).join("")}
      </div>

      ${
        disponivel
        ? `<button onclick='abrirPegar(${JSON.stringify(rota)})'>Pegar rota</button>`
        : `<button disabled>Indisponível</button>`
      }
    `;

    container.appendChild(card);
  });
}

function abrirPegar(rota) {
  rotaAtual = rota;
  rotaSelecionada.innerText = `Rota: ${rota.route_name}\nRegião: ${rota.region}`;
  driverId.value = "";
  abrirModal("modalPegar");
}

async function confirmarRota() {
  const id = driverId.value.trim();
  if (!id) return;

  const res = await fetch(API + "/claim-route.php", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      driver_id: id,
      route_id: rotaAtual.id
    })
  });

  const data = await res.json();

  fecharModal("modalPegar");

  if (data.success) {
    mostrarResultado(
      "Rota confirmada",
      `Você pegou esta rota:\n${data.route.route_name}`
    );
  } else {
    mostrarResultado(
      "Não foi possível pegar esta rota",
      data.error || "A rota pode já ter sido repassada."
    );
  }

  carregarRotas(true);
}

function abrirAguardarGalpao() {
  waitingDriverId.value = "";
  abrirModal("modalAguardar");
}

function confirmarAguardarGalpao() {
  const id = waitingDriverId.value.trim();
  if (!id) return;

  if (!navigator.geolocation) {
    mostrarResultado("Localização indisponível", "Seu navegador não permite validar localização.");
    return;
  }

  navigator.geolocation.getCurrentPosition(async pos => {
    const res = await fetch(API + "/waiting-register.php", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        driver_id: id,
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude
      })
    });

    const data = await res.json();

    fecharModal("modalAguardar");

    if (data.success) {
      mostrarResultado("Presença registrada", data.message);
    } else {
      mostrarResultado("Não foi possível registrar", data.error || "Tente novamente.");
    }
  }, () => {
    fecharModal("modalAguardar");
    mostrarResultado("Localização não permitida", "Para registrar presença, é necessário permitir o acesso à localização.");
  }, {
    enableHighAccuracy: true,
    timeout: 15000,
    maximumAge: 0
  });
}

carregarRotas(true);
setInterval(() => carregarRotas(false), 15000);
</script>

</body>
</html>
