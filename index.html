<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Rotas Disponíveis</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
}

.container {
    max-width: 400px;
    margin: auto;
}

.card {
    background: #1f1f1f;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
}

button {
    background: #ee4d2d;
    color: white;
    border: none;
    padding: 10px;
    width: 100%;
    border-radius: 5px;
    cursor: pointer;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
}
</style>
</head>

<body>

<div class="container">
    <h2>Rotas Disponíveis</h2>

    <input id="driverId" placeholder="Digite seu ID">

    <div id="rotas"></div>
</div>

<script>
const API = "https://truthful-acceptance-production-fb55.up.railway.app";

async function carregarRotas() {
    const res = await fetch(API + "/routes.php");
    const data = await res.json();

    const container = document.getElementById("rotas");
    container.innerHTML = "";

    if (data.length === 0) {
        container.innerHTML = "<p>Nenhuma rota disponível</p>";
        return;
    }

    data.forEach(r => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <h3>${r.route_name}</h3>
            <p>${r.region}</p>
            <button onclick="pegarRota(${r.id})">Pegar rota</button>
        `;

        container.appendChild(div);
    });
}

async function pegarRota(routeId) {
    const driverId = document.getElementById("driverId").value;

    if (!driverId) {
        alert("Digite seu ID");
        return;
    }

    const res = await fetch(API + "/claim-route.php", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            driver_id: driverId,
            route_id: routeId
        })
    });

    const data = await res.json();

    if (data.success) {
        alert("✅ Você pegou esta rota!");
        carregarRotas();
    } else {
        alert("❌ " + data.error);
    }
}

carregarRotas();
setInterval(carregarRotas, 5000);
</script>

</body>
</html>
