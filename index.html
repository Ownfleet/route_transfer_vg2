<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotas Disponíveis</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #030712;
  color: white;
}

header {
  text-align: center;
  padding: 26px 15px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

.grid {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 24px;
}

.card {
  position: relative;
  background: linear-gradient(145deg, #171b2a, #0b1020);
  border: 1px solid #2b3448;
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 12px 30px rgba(0,0,0,.35);
  overflow: hidden;
}

.status {
  position: absolute;
  top: 18px;
  right: -35px;
  background: #052e16;
  color: #86efac;
  border: 1px solid #22c55e;
  transform: rotate(10deg);
  padding: 8px 55px;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
}

.card h2 {
  margin: 0 0 12px;
  font-size: 22px;
}

.card p {
  font-size: 18px;
  font-weight: bold;
}

.tags {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 18px 0;
}

.tag {
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: bold;
  border: 1px solid #facc15;
  color: #facc15;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: #ee4d2d;
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #ff6a3d;
}

.empty {
  text-align: center;
  color: #ccc;
  margin-top: 40px;
  grid-column: 1 / -1;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.78);
  align-items: center;
  justify-content: center;
  z-index: 10;
  padding: 18px;
}

.modal.show {
  display: flex;
}

.modal-box {
  background: linear-gradient(145deg, #111827, #080d1c);
  border: 1px solid #374151;
  border-radius: 24px;
  padding: 24px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 25px 60px rgba(0,0,0,.55);
}

.modal-box h2 {
  margin-top: 0;
  color: #ffb199;
}

.modal-box p {
  color: #cbd5e1;
  line-height: 1.5;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  border: 1px solid #374151;
  background: #020617;
  color: white;
  margin: 12px 0;
  font-size: 16px;
}

.cancelar {
  background: #374151;
  margin-top: 10px;
}

.success {
  color: #86efac;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>Rotas Disponíveis</h1>
</header>

<main class="grid" id="rotas"></main>

<div class="modal" id="modalPegar">
  <div class="modal-box">
    <h2>Confirmar rota</h2>
    <p id="rotaSelecionada"></p>
    <input id="driverId" placeholder="Digite seu ID">
    <button onclick="confirmarRota()">Confirmar e pegar rota</button>
    <button class="cancelar" onclick="fecharModal('modalPegar')">Cancelar</button>
  </div>
</div>

<div class="modal" id="modalResultado">
  <div class="modal-box">
    <h2 id="resultadoTitulo"></h2>
    <p id="resultadoTexto"></p>
    <button onclick="fecharModal('modalResultado')">Entendi</button>
  </div>
</div>

<script>
const API = "https://truthful-acceptance-production-fb55.up.railway.app";
let rotaAtual = null;

function abrirModal(id) {
  document.getElementById(id).classList.add("show");
}

function fecharModal(id) {
  document.getElementById(id).classList.remove("show");
}

function mostrarResultado(titulo, texto) {
  resultadoTitulo.innerText = titulo;
  resultadoTexto.innerText = texto;
  abrirModal("modalResultado");
}

async function carregarRotas() {
  const res = await fetch(API + "/routes.php");
  const rotas = await res.json();

  rotas.innerHTML;

  const container = document.getElementById("rotas");
  container.innerHTML = "";

  if (!rotas.length) {
    container.innerHTML = `<div class="empty">Nenhuma rota disponível no momento.</div>`;
    return;
  }

  rotas.forEach(rota => {
    const veiculos = String(rota.allowed_vehicles)
      .replace("{", "")
      .replace("}", "")
      .split(",");

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="status">DISPONÍVEL</div>
      <h2>ROTA: ${rota.route_name}</h2>
      <p>Região: ${rota.region}</p>
      <div class="tags">
        ${veiculos.map(v => `<span class="tag">${v}</span>`).join("")}
      </div>
      <button onclick='abrirPegar(${JSON.stringify(rota)})'>Pegar rota</button>
    `;

    container.appendChild(card);
  });
}

function abrirPegar(rota) {
  rotaAtual = rota;
  rotaSelecionada.innerText = `Rota: ${rota.route_name}\nRegião: ${rota.region}`;
  driverId.value = "";
  abrirModal("modalPegar");
}

async function confirmarRota() {
  const id = driverId.value.trim();
  if (!id) return;

  const res = await fetch(API + "/claim-route.php", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      driver_id: id,
      route_id: rotaAtual.id
    })
  });

  const data = await res.json();

  fecharModal("modalPegar");

  if (data.success) {
    mostrarResultado(
      "Rota confirmada",
      `Você pegou esta rota: ${data.route.route_name}`
    );
  } else {
    mostrarResultado(
      "Não foi possível pegar esta rota",
      data.error || "A rota pode já ter sido repassada."
    );
  }

  carregarRotas();
}

carregarRotas();
setInterval(carregarRotas, 5000);
</script>

</body>
</html>
