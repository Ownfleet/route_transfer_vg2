<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotas Disponíveis</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #030712;
  color: white;
}

header {
  text-align: center;
  padding: 26px 15px 10px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

.top-actions {
  max-width: 520px;
  margin: 14px auto 0;
  padding: 0 20px;
}

.wait-btn {
  background: #16a34a;
}

.grid {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 24px;
}

.card {
  position: relative;
  background: linear-gradient(145deg, #171b2a, #0b1020);
  border: 1px solid #2b3448;
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 12px 30px rgba(0,0,0,.35);
  overflow: hidden;
}

.status {
  position: absolute;
  top: 18px;
  right: -35px;
  transform: rotate(10deg);
  padding: 8px 55px;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
  border: 1px solid;
}

.disponivel {
  background: #052e16;
  color: #86efac;
  border-color: #22c55e;
}

.repassada {
  background: #3b2f06;
  color: #fde68a;
  border-color: #facc15;
}

.card h2 {
  margin: 0 0 12px;
  font-size: 22px;
}

.card p {
  font-size: 18px;
  font-weight: bold;
}

.tags {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 18px 0;
}

.tag {
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: bold;
  border: 1px solid #facc15;
  color: #facc15;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: #ee4d2d;
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.08);
}

button:disabled {
  background: #111827;
  color: #6b7280;
  cursor: not-allowed;
  border: 1px solid #1f2937;
}

.empty {
  text-align: center;
  color: #ccc;
  margin-top: 40px;
  grid-column: 1 / -1;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.78);
  align-items: center;
  justify-content: center;
  z-index: 10;
  padding: 18px;
}

.modal.show {
  display: flex;
}

.modal-box {
  background: linear-gradient(145deg, #111827, #080d1c);
  border: 1px solid #374151;
  border-radius: 24px;
  padding: 24px;
  width: 100%;
  max-width: 460px;
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: 0 25px 60px rgba(0,0,0,.55);
}

.modal-box.large {
  max-width: 720px;
}

.modal-box h2 {
  margin-top: 0;
  color: #ffb199;
}

.modal-box p {
  color: #cbd5e1;
  line-height: 1.5;
  white-space: pre-line;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  border: 1px solid #374151;
  background: #020617;
  color: white;
  margin: 12px 0;
  font-size: 16px;
}

.cancelar {
  background: #374151;
  margin-top: 10px;
}

#mapaGalpao {
  width: 100%;
  height: 330px;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid #374151;
  margin: 14px 0;
}

.map-info {
  background: #020617;
  border: 1px solid #263044;
  border-radius: 16px;
  padding: 14px;
  margin: 12px 0;
}

.map-ok {
  color: #86efac;
  font-weight: bold;
}

.map-bad {
  color: #fca5a5;
  font-weight: bold;
}

.map-warn {
  color: #fde68a;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>Rotas Disponíveis</h1>
  <div class="top-actions">
    <button class="wait-btn" onclick="abrirAguardarGalpao()">Aguardar rota no galpão</button>
  </div>
</header>

<main class="grid" id="rotas"></main>

<div class="modal" id="modalPegar">
  <div class="modal-box">
    <h2>Confirmar rota</h2>
    <p id="rotaSelecionada"></p>
    <input id="driverId" placeholder="Digite seu ID">
    <button onclick="confirmarRota()">Confirmar e pegar rota</button>
    <button class="cancelar" onclick="fecharModal('modalPegar')">Cancelar</button>
  </div>
</div>

<div class="modal" id="modalAguardar">
  <div class="modal-box large">
    <h2>Aguardar rota no galpão</h2>
    <p>Digite seu ID e permita a localização do celular para analisar se você está dentro do raio permitido.</p>
    <input id="waitingDriverId" placeholder="Digite seu ID">

    <div id="mapaGalpao"></div>

    <div id="analiseLocalizacao" class="map-info">
      O mapa será carregado após validar sua localização.
    </div>

    <button onclick="analisarLocalizacao()">Analisar localização</button>
    <button id="btnRegistrarPresenca" style="display:none;" onclick="registrarPresencaConfirmada()">Confirmar presença no galpão</button>
    <button class="cancelar" onclick="fecharModal('modalAguardar')">Cancelar</button>
  </div>
</div>

<div class="modal" id="modalResultado">
  <div class="modal-box">
    <h2 id="resultadoTitulo"></h2>
    <p id="resultadoTexto"></p>
    <button onclick="fecharModal('modalResultado')">Entendi</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const API = "https://truthful-acceptance-production-fb55.up.railway.app";
let rotaAtual = null;

let mapa = null;
let camadaHub = null;
let camadaRaio = null;
let camadaMotorista = null;
let camadaPrecisao = null;
let ultimaLocalizacao = null;
let ultimaConfigGalpao = null;

function existeModalAberto() {
  return document.querySelector(".modal.show") !== null;
}

function abrirModal(id) {
  document.getElementById(id).classList.add("show");
}

function fecharModal(id) {
  document.getElementById(id).classList.remove("show");
}

function mostrarResultado(titulo, texto) {
  resultadoTitulo.innerText = titulo;
  resultadoTexto.innerText = texto;
  abrirModal("modalResultado");
}

async function carregarRotas(forcar = false) {
  if (!forcar && existeModalAberto()) return;

  const res = await fetch(API + "/routes.php");
  const rotasData = await res.json();

  const container = document.getElementById("rotas");
  container.innerHTML = "";

  if (!rotasData.length) {
    container.innerHTML = `<div class="empty">Nenhuma rota divulgada no momento.</div>`;
    return;
  }

  rotasData.forEach(rota => {
    const veiculos = String(rota.allowed_vehicles)
      .replace("{", "")
      .replace("}", "")
      .split(",");

    const disponivel = rota.status === "disponivel";

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="status ${disponivel ? "disponivel" : "repassada"}">
        ${disponivel ? "DISPONÍVEL" : "ROTA REPASSADA"}
      </div>

      <h2>ROTA: ${rota.route_name}</h2>
      <p>Região: ${rota.region}</p>

      <div class="tags">
        ${veiculos.map(v => `<span class="tag">${v}</span>`).join("")}
      </div>

      ${
        disponivel
        ? `<button onclick='abrirPegar(${JSON.stringify(rota)})'>Pegar rota</button>`
        : `<button disabled>Indisponível</button>`
      }
    `;

    container.appendChild(card);
  });
}

function abrirPegar(rota) {
  rotaAtual = rota;
  rotaSelecionada.innerText = `Rota: ${rota.route_name}\nRegião: ${rota.region}`;
  driverId.value = "";
  abrirModal("modalPegar");
}

async function confirmarRota() {
  const id = driverId.value.trim();
  if (!id) return;

  const res = await fetch(API + "/claim-route.php", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      driver_id: id,
      route_id: rotaAtual.id
    })
  });

  const data = await res.json();

  fecharModal("modalPegar");

  if (data.success) {
    mostrarResultado(
      "Rota confirmada",
      `Você pegou esta rota:\n${data.route.route_name}`
    );
  } else {
    mostrarResultado(
      "Não foi possível pegar esta rota",
      data.error || "A rota pode já ter sido repassada."
    );
  }

  carregarRotas(true);
}

async function abrirAguardarGalpao() {
  waitingDriverId.value = "";
  btnRegistrarPresenca.style.display = "none";
  ultimaLocalizacao = null;

  analiseLocalizacao.innerHTML = "Carregando configuração do galpão...";
  abrirModal("modalAguardar");

  await carregarConfigGalpao();
  setTimeout(inicializarMapa, 200);
}

async function carregarConfigGalpao() {
  const res = await fetch(API + "/hub-public-config.php");
  const cfg = await res.json();

  if (!cfg) {
    analiseLocalizacao.innerHTML = `<span class="map-bad">Galpão ainda não configurado.</span>`;
    return null;
  }

  ultimaConfigGalpao = {
    hub_name: cfg.hub_name,
    latitude: Number(cfg.latitude),
    longitude: Number(cfg.longitude),
    radius_meters: Number(cfg.radius_meters)
  };

  analiseLocalizacao.innerHTML =
    `Galpão configurado: <strong>${ultimaConfigGalpao.hub_name}</strong>\n` +
    `Raio permitido: <strong>${ultimaConfigGalpao.radius_meters}m</strong>\n` +
    `Clique em "Analisar localização".`;

  return ultimaConfigGalpao;
}

function inicializarMapa() {
  if (!ultimaConfigGalpao) return;

  if (!mapa) {
    mapa = L.map("mapaGalpao");
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: ""
    }).addTo(mapa);
  }

  mapa.invalidateSize();

  const hub = [ultimaConfigGalpao.latitude, ultimaConfigGalpao.longitude];

  if (camadaHub) mapa.removeLayer(camadaHub);
  if (camadaRaio) mapa.removeLayer(camadaRaio);

  camadaHub = L.marker(hub).addTo(mapa).bindPopup("Galpão");
  camadaRaio = L.circle(hub, {
    radius: ultimaConfigGalpao.radius_meters
  }).addTo(mapa);

  mapa.setView(hub, 16);
}

function distanciaMetros(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;

  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

function analisarLocalizacao() {
  const id = waitingDriverId.value.trim();
  if (!id) return;

  if (!ultimaConfigGalpao) {
    mostrarResultado("Galpão não configurado", "Configure o galpão no painel admin antes de registrar presença.");
    return;
  }

  if (!navigator.geolocation) {
    mostrarResultado("Localização indisponível", "Seu navegador não permite validar localização.");
    return;
  }

  analiseLocalizacao.innerHTML = "Buscando localização precisa do celular...";

  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const accuracy = pos.coords.accuracy || 0;

    ultimaLocalizacao = {
      driver_id: id,
      latitude: lat,
      longitude: lon,
      accuracy
    };

    const distancia = distanciaMetros(
      ultimaConfigGalpao.latitude,
      ultimaConfigGalpao.longitude,
      lat,
      lon
    );

    const dentro = distancia <= ultimaConfigGalpao.radius_meters;

    if (camadaMotorista) mapa.removeLayer(camadaMotorista);
    if (camadaPrecisao) mapa.removeLayer(camadaPrecisao);

    camadaMotorista = L.marker([lat, lon]).addTo(mapa).bindPopup("Você");
    camadaPrecisao = L.circle([lat, lon], {
      radius: accuracy
    }).addTo(mapa);

    const grupo = L.featureGroup([camadaHub, camadaRaio, camadaMotorista, camadaPrecisao]);
    mapa.fitBounds(grupo.getBounds().pad(0.25));

    let textoPrecisao = "";
    if (accuracy > ultimaConfigGalpao.radius_meters) {
      textoPrecisao = `\n<span class="map-warn">Atenção: o GPS está impreciso (${Math.round(accuracy)}m). Tente ativar localização precisa, sair de locais fechados ou tentar novamente.</span>`;
    }

    analiseLocalizacao.innerHTML =
      `<strong>Distância até o galpão:</strong> ${Math.round(distancia)}m\n` +
      `<strong>Raio permitido:</strong> ${ultimaConfigGalpao.radius_meters}m\n` +
      `<strong>Precisão informada pelo celular:</strong> ${Math.round(accuracy)}m\n` +
      (dentro
        ? `<span class="map-ok">Status: dentro do raio permitido.</span>`
        : `<span class="map-bad">Status: fora do raio permitido.</span>`) +
      textoPrecisao;

    btnRegistrarPresenca.style.display = dentro ? "block" : "none";

  }, () => {
    mostrarResultado("Localização não permitida", "Para registrar presença, é necessário permitir o acesso à localização precisa.");
  }, {
    enableHighAccuracy: true,
    timeout: 20000,
    maximumAge: 0
  });
}

async function registrarPresencaConfirmada() {
  if (!ultimaLocalizacao) return;

  const res = await fetch(API + "/waiting-register.php", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(ultimaLocalizacao)
  });

  const data = await res.json();

  if (data.success) {
    fecharModal("modalAguardar");
    mostrarResultado(
      "Presença registrada",
      `${data.message}\nDistância: ${Math.round(Number(data.distance_meters || 0))}m\nRaio: ${data.radius_meters}m`
    );
  } else {
    analiseLocalizacao.innerHTML =
      `<span class="map-bad">${data.error || "Não foi possível registrar."}</span>\n` +
      (data.distance_meters ? `Distância: ${Math.round(Number(data.distance_meters))}m\n` : "") +
      (data.radius_meters ? `Raio permitido: ${data.radius_meters}m\n` : "") +
      (data.accuracy_meters ? `Precisão do GPS: ${Math.round(Number(data.accuracy_meters))}m` : "");
  }
}

carregarRotas(true);
setInterval(() => carregarRotas(false), 15000);
</script>

</body>
</html>
